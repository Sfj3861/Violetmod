name: Build Violetmod

on:
  push:
    branches:
      - violetmod-gameplay-suite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: windows-latest
          - target: Android64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Geode SDK from mod.json
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: violetmod-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
